name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "display=v$(echo "$ver" | cut -d. -f1).$(echo "$ver" | cut -d. -f2)" >> "$GITHUB_OUTPUT"

      # The install root holds only the launcher; the real multi-file app lives in app\,
      # so updates replace only the couple of MB of app assemblies, not the ~60MB runtime.
      - name: Publish app
        run: >
          dotnet publish CICMessenger.UI/CICMessenger.UI.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          --output ./install/CICMessenger/app

      - name: Publish launcher
        run: >
          dotnet publish CICMessenger.Launcher/CICMessenger.Launcher.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true
          --output ./install/CICMessenger

      - name: Generate manifest and assets
        shell: pwsh
        run: |
          $installDir = "./install/CICMessenger"
          $appDir = Join-Path $installDir "app"
          $assetDir = "./assets"
          New-Item -ItemType Directory -Path $assetDir | Out-Null

          # keep the install root clean: only the launcher exe
          Get-ChildItem $installDir -File | Where-Object { $_.Name -ne "CICMessenger.exe" } | Remove-Item -Force

          $files = @()
          Get-ChildItem $appDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $appDir).Path.Length + 1) -replace "\\","/"
            if ($rel -eq "manifest.json") { return }
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $files += [ordered]@{ path = $rel; sha256 = $hash; size = $_.Length }
          }
          $manifest = [ordered]@{ version = "${{ steps.version.outputs.version }}"; tag = "${{ github.ref_name }}"; files = $files }
          $manifestPath = Join-Path $appDir "manifest.json"
          # UTF-8 without BOM — a BOM makes JsonDocument.Parse in the updater throw.
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 5), (New-Object System.Text.UTF8Encoding $false))

          # manifest + individual app files (small, change every release)
          Copy-Item $manifestPath (Join-Path $assetDir "manifest.json")
          Get-ChildItem $appDir -File | Where-Object { $_.Name -like "CICMessenger*" -and $_.Name -ne "manifest.json" } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $assetDir $_.Name) }

          # full setup zip (launcher + app\) for first install / runtime changes
          Compress-Archive -Path $installDir `
            -DestinationPath (Join-Path $assetDir "CICMessenger-${{ steps.version.outputs.display }}-setup.zip") -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          files: ./assets/*
