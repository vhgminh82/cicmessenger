name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: [self-hosted, Linux]
            rid: linux-x64
            artifact: CICMessenger-linux-x64
          - os: [self-hosted, Linux]
            rid: win-x64
            artifact: CICMessenger-win-x64
          - os: macos-latest
            rid: osx-x64
            artifact: CICMessenger-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: CICMessenger-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish CICMessenger.UI/CICMessenger.UI.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Package (zip for Windows target)
        if: contains(matrix.rid, 'win')
        run: cd ./publish && zip -r ../${{ matrix.artifact }}.zip .

      - name: Package (tar.gz for Linux/macOS)
        if: "!contains(matrix.rid, 'win')"
        run: tar -czf ./${{ matrix.artifact }}.tar.gz -C ./publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ./${{ matrix.artifact }}.zip
            ./${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          files: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.tar.gz